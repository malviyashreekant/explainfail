[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "explainfail"
version = "0.1.0"
description = "Plain-English explanations for failed jobs, scripts and pipelines. Rules first, AI optional."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "explainfail contributors" }]
keywords = ["logs", "debugging", "scheduler", "control-m", "airflow", "cron", "failure-analysis", "llm", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
litellm = ["litellm>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.0", "twine>=5.0"]

[project.scripts]
explainfail = "explainfail.cli:main"

[project.urls]
Homepage = "https://github.com/malviyashreekant/explainfail"
Issues = "https://github.com/malviyashreekant/explainfail/issues"
Changelog = "https://github.com/malviyashreekant/explainfail/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
explainfail = ["rules/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
